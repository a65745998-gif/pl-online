<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PL-Online - متجر الألعاب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; }
        .search-box { width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 25px; outline: none; }
        .game-card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 15px; border: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .game-info h3 { font-size: 18px; color: #f1f5f9; margin-bottom: 5px; }
        .game-info span { font-size: 13px; color: #38bdf8; }
        .download-btn { background: #0284c7; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .download-btn:active { background: #0369a1; }
    </style>
</head>
<body>

    <header>
        <h1>PL-Online</h1>
        <p>متجرك الاحترافي لتحميل الألعاب المباشرة</p>
    </header>

    <input type="text" class="search-box" placeholder="ابحث عن لعبتك المفضلة..." id="searchInput">

    <div class="game-card" data-title="ماين كرافت">
        <div class="game-info">
            <h3>ماين كرافت (Minecraft)</h3>
            <span>النسخة الأصلية المباشرة</span>
        </div>
        <a href="https://www.minecraft.net" class="download-btn" target="_blank">تحميل</a>
    </div>

    <div class="game-card" data-title="روبلوكس">
        <div class="game-info">
            <h3>روبلوكس (Roblox)</h3>
            <span>النسخة التفاعلية</span>
        </div>
        <a href="https://www.roblox.com" class="download-btn" target="_blank">تحميل</a>
    </div>

</body>
</html>
